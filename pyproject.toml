[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2x-bert"
version = "1.0.0"
description = "V2X-BERT: Compact Standards-Aware Bidirectional Transformer for Vehicular Telemetry & Misbehavior Detection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Umer Tanveer", email = "umertanveer@awkum.edu.pk"},
    {name = "Abdu Salam", email = "abdusalam@awkum.edu.pk"}
]
keywords = [
    "v2x",
    "bert",
    "autonomous-vehicles",
    "cacc",
    "cybersecurity",
    "c-v2x",
    "dsrc",
    "sae-j2735",
    "etsi-cam",
    "misbehavior-detection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "twine>=4.0.0",
    "build>=0.10.0"
]
viz = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0"
]

[project.urls]
"Homepage" = "https://github.com/umertanveer25/V2X-BERT"
"Bug Tracker" = "https://github.com/umertanveer25/V2X-BERT/issues"
"Documentation" = "https://github.com/umertanveer25/V2X-BERT#readme"
